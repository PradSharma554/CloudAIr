# Render Blueprint — deploy with "New > Blueprint" pointing at this repo.
# Free plan: single instance, 512MB, spins down after 15 min idle.
services:
  - type: web
    name: cloudair
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm ci && npm run build
    startCommand: npm start
    # /ping is DB-free liveness; /healthz queries Neon and would keep its
    # compute awake 24/7 via Render's continuous health checks.
    healthCheckPath: /ping
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: DATABASE_URL
        sync: false # paste your Neon connection string
      - key: API_JWT_SECRET
        sync: false # same value as the Vercel app's API_JWT_SECRET
      - key: INTERNAL_TOKEN
        generateValue: true
      - key: GEMINI_API_KEY
        sync: false # optional — fallback mode without it
      - key: PUBLIC_BASE_URL
        sync: false # e.g. https://cloudair.onrender.com (set after first deploy)
